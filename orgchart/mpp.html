  :root{

  @media print{

  /* ---------- Login gate (kredensial sama dgn HRGA Hub) ---------- */
  body.pre-auth > *:not(#loginScreen){display:none;}
  #loginScreen{display:none; position:fixed; inset:0; background:linear-gradient(rgba(250,250,250,.55),rgba(250,250,250,.55)), url('../main/bg_login.png') center/cover no-repeat, #fafafa; z-index:1000; align-items:center; justify-content:center; padding:20px;}
  body.pre-auth #loginScreen{display:flex;}
  .login-card{width:100%; max-width:340px; background:#fff; border:1px solid #ddd; border-radius:8px; padding:32px 28px; box-shadow:0 2px 12px rgba(0,0,0,.07);}
  .login-card h2{margin:0 0 6px; font-size:19px; text-align:center; text-transform:uppercase; letter-spacing:.3px; color:#111;}
  .login-card .sub{font-size:12px; color:#777; text-align:center; margin:0 0 20px; line-height:1.5;}
  .login-card label{display:block; font-size:11px; font-weight:bold; color:#555; margin:12px 0 5px; text-transform:uppercase; letter-spacing:.3px;}

  .login-card button{width:100%; margin-top:16px; padding:10px; background:#1a1a2e; color:#fff; border:none; border-radius:5px; font-size:13px; font-weight:bold; text-transform:uppercase; letter-spacing:.3px; cursor:pointer;}

</style>

<script>
const SHEET_ID='1mHMrWu6yQ7p6gL_fQz_G6fa8ew2V2LcJ3WHZXwYZo7c';
const CSV = sheet => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&t=${Date.now()}`;
// urutan & label level (harus sama dgn kolom "Level" di sheet Struktur)
const LEVELS=[
  ['Manager','Manager'],
  ['Asisten Kepala','Asisten Kepala'],
  ['Koordinator','Koordinator'],
  ['Asisten','Asisten'],
  ['Mandor1/Krani1','Mandor 1 / Krani 1'],
  ['Mandor/Krani','Mandor / Krani'],
  ['Worker','Worker']
];
// di MPP, "Sub Mandor/Krani" digabung jadi satu level dgn "Mandor/Krani"
// (di Org Chart, Sub tetap dipakai terpisah hanya sbg pemisah cabang)
const LEVEL_MERGE = { 'sub mandor/krani':'Mandor/Krani' };
const mergeLevel = lv => LEVEL_MERGE[lv.toLowerCase()] || lv;
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"'; i++;} else q=false; } else cur+=c; }
    else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
const norm = s => (s||'').trim();
const baseJabatan = j => norm(j).replace(/^Act\.\s*/i,'').trim();
const isVac = n => { const s=norm(n).toLowerCase(); return s===''||s.startsWith('vacant'); };
let deptData={}, deptOrder=[];
async function loadData(){
  const el=document.getElementById('chart');
  el.className='msg'; el.textContent='Memuat data dari Google Sheet…';
  document.querySelector('.tblwrap').innerHTML=''; document.querySelector('.tblwrap').appendChild(el);
  try{
    const res=await fetch(CSV('Struktur'));
    if(!res.ok) throw new Error('Gagal mengambil sheet Struktur ('+res.status+')');
    const rows=parseCSV(await res.text());
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const iJ=head.indexOf('nama jabatan'), iN=head.indexOf('nama'), iL=head.indexOf('level'),
          iNik=(head.indexOf('nik_fix')>=0?head.indexOf('nik_fix'):head.indexOf('nik')), iDept=head.indexOf('departemen'),
          iNorma=head.indexOf('norma'), iActual=head.indexOf('actual'), iStatus=head.indexOf('status');
    if(iJ<0||iN<0||iL<0) throw new Error('Kolom Nama Jabatan / Nama / Level tidak ditemukan di sheet Struktur');
    deptData={}; deptOrder=[];
    rows.slice(1).forEach(r=>{
      const jab=norm(r[iJ]);
      let lv=norm(r[iL]);
      if(!jab || !lv) return;
      lv=mergeLevel(lv);
      const dept = iDept>=0 ? (norm(r[iDept])||'(Tanpa Departemen)') : '(Semua)';
      const nama=norm(r[iN]), nik=iNik>=0?norm(r[iNik]):'';
      const norma = iNorma>=0 ? (parseFloat(norm(r[iNorma]))||0) : (isVac(nama)?0:1);
      const actual = iActual>=0 ? (parseFloat(norm(r[iActual]))||0) : (isVac(nama)?0:1);
      const status = iStatus>=0 ? norm(r[iStatus]).toLowerCase() : (isVac(nama)?'':'tetap');
      if(!deptData[dept]){ deptData[dept]={}; deptOrder.push(dept); }
      if(!deptData[dept][lv]) deptData[dept][lv]={groups:{}, order:[]};
      const key=baseJabatan(jab);
      const g=deptData[dept][lv];
      if(!g.groups[key]){ g.groups[key]={jab:key, rows:[]}; g.order.push(key); }
      g.groups[key].rows.push({nama, nik, norma, actual, status});
    });
    const sel=document.getElementById('deptSel');
    const prev=sel.value;
    sel.innerHTML='';
    deptOrder.forEach((d,i)=>{
      const o=document.createElement('option'); o.value=i; o.textContent=d; sel.appendChild(o);
    });
    if(prev && sel.querySelector(`option[value="${prev}"]`)) sel.value=prev;
    render();
  }catch(e){
    el.className='msg err';
    el.innerHTML='Gagal memuat data: '+e.message+
      '<br><small>Pastikan Google Sheet di-share "Siapa saja yang memiliki link — Viewer", lalu klik Muat Ulang Data.</small>';
  }
}
function render(){
  const wrap=document.querySelector('.tblwrap');
  const dept=deptOrder[+document.getElementById('deptSel').value||0];
  if(!dept) return;
  document.getElementById('title').textContent='Man Power Planning — '+dept;
  const data=deptData[dept];
  let body='';
  let grand={norma:0,keb:0,tetap:0,kontrak:0,total:0,thN:0,thK:0};
  LEVELS.forEach(([key,label])=>{
    const lvData=data[key];
    if(!lvData || !lvData.order.length) return;
    let levelRows=0;
    const jabHtml=[];
    let sub={norma:0,keb:0,tetap:0,kontrak:0,total:0,thN:0,thK:0};
    lvData.order.forEach((k,idx)=>{
      const grp=lvData.groups[k];
      const norma=grp.rows.reduce((s,r)=>s+r.norma,0);
      const keb=norma;
      const tetap=grp.rows.filter(r=>r.status.includes('tetap')).reduce((s,r)=>s+r.actual,0);
      const total=grp.rows.reduce((s,r)=>s+r.actual,0);
      const kontrak=total-tetap; // sisanya (bukan "tetap") dihitung Kontrak, supaya Tetap+Kontrak selalu = Total
      const thN=total-norma, thK=total-keb;
      const rs=Math.max(1, grp.rows.length);
      levelRows+=rs;
      sub.norma+=norma; sub.keb+=keb; sub.tetap+=tetap; sub.kontrak+=kontrak; sub.total+=total; sub.thN+=thN; sub.thK+=thK;
      const numsTd = extra => `
        <td class="no" rowspan="${rs}">${idx+1}</td>
        <td class="jab" rowspan="${rs}">${grp.jab}</td>
        <td class="num" rowspan="${rs}">${norma}</td>
        <td class="num" rowspan="${rs}">${keb}</td>
        <td class="num" rowspan="${rs}">${tetap}</td>
        <td class="num" rowspan="${rs}">${kontrak}</td>
        <td class="num" rowspan="${rs}">${total}</td>
        <td class="num" rowspan="${rs}">${thN}</td>
        <td class="num" rowspan="${rs}">${thK}</td>${extra}`;
      const cellFor = r => `<td class="nik">${r.nik||''}</td><td class="nama${isVac(r.nama)?' vac':''}">${r.nama?r.nama:'Vacant'}</td>`;
      if(grp.rows.length){
        jabHtml.push(`<tr>${numsTd(cellFor(grp.rows[0]))}</tr>`);
        for(let i=1;i<grp.rows.length;i++){
          jabHtml.push(`<tr>${cellFor(grp.rows[i])}</tr>`);
        }
      }else{
        jabHtml.push(`<tr>${numsTd(`<td class="nik"></td><td class="nama vac">Vacant</td>`)}</tr>`);
      }
    });
    // sisipkan <td level rowspan> ke baris pertama blok
    let inserted=false;
    const blockRows = jabHtml.map(rowStr=>{
      if(!inserted){
        inserted=true;
        return rowStr.replace('<tr>', `<tr><td class="level" rowspan="${levelRows+1}">${label}</td>`);
      }
      return rowStr;
    }).join('');
    body += blockRows +
      `<tr class="subtotal"><td colspan="2">Sub Total</td><td class="num">${sub.norma}</td><td class="num">${sub.keb}</td><td class="num">${sub.tetap}</td><td class="num">${sub.kontrak}</td><td class="num">${sub.total}</td><td class="num">${sub.thN}</td><td class="num">${sub.thK}</td><td colspan="2"></td></tr>`;
    grand.norma+=sub.norma; grand.keb+=sub.keb; grand.tetap+=sub.tetap; grand.kontrak+=sub.kontrak;
    grand.total+=sub.total; grand.thN+=sub.thN; grand.thK+=sub.thK;
  });
  body += `<tr class="subtotal" style="background:#9fc5e8"><td colspan="3">TOTAL DEPARTEMEN</td><td class="num">${grand.norma}</td><td class="num">${grand.keb}</td><td class="num">${grand.tetap}</td><td class="num">${grand.kontrak}</td><td class="num">${grand.total}</td><td class="num">${grand.thN}</td><td class="num">${grand.thK}</td><td colspan="2"></td></tr>`;
  const html=`<table>
    <thead>
      <tr>
        <th rowspan="3">LEVEL</th>
        <th colspan="2" rowspan="3">JABATAN</th>
        <th colspan="5">MP</th>
        <th rowspan="3">Thd Norma<br>+/-</th>
        <th rowspan="3">Thd Kebutuhan<br>+/-</th>
        <th colspan="2">Incumbent</th>
      </tr>
      <tr>
        <th rowspan="2">Norma</th>
        <th rowspan="2">Kebutuhan</th>
        <th colspan="3">Real saat ini</th>
        <th rowspan="2">NIK</th>
        <th rowspan="2">NAMA</th>
      </tr>
      <tr>
        <th>Tetap</th><th>Kontrak</th><th>Total</th>
      </tr>
    </thead>
    <tbody>${body}</tbody>
  </table>`;
  wrap.innerHTML=html;
  // tandai nama vacant (harusnya sudah tersaring, jaga-jaga saja)
  wrap.querySelectorAll('td.nama').forEach(td=>{ if(isVac(td.textContent)) td.classList.add('vac'); });
}

/* =====================================================================
   LOGIN GATE - kredensial SAMA dengan HRGA Hub (https://hrga.btliglbja.site/main/)
   dan halaman Struktur Organisasi (index.html), dicek terhadap sheet "user"
   (Nama, username, password, role) di spreadsheet terpisah (USER_SHEET_ID).
   Status login (termasuk password, supaya bisa divalidasi ulang) disimpan
   di localStorage (bukan sessionStorage) supaya kalau sudah login di
   halaman lain, halaman ini otomatis ikut ter-login tanpa perlu login ulang
   - selama origin-nya sama dan belum logout. Setiap kali halaman
   dimuat/di-refresh, kredensial yang ter-cache DICEK ULANG live ke sheet
   "user": kalau masih cocok, sesi diteruskan; kalau sudah tidak cocok
   (password diganti / user dihapus dari sheet), sesi otomatis dihapus dan
   user diminta login ulang. CATATAN: sheet "user" harus bisa diakses publik
   supaya bisa di-fetch sbg CSV dari browser, jadi ini bukan proteksi
   keamanan sungguhan, cuma gerbang login sederhana.
   ===================================================================== */
const USER_SHEET_ID = '1_B1SUrE4eIYJ-fcLBPyQmntKIXAX3YKFP6RsfHPKU9s';
function userCsvUrl(){
  return `https://docs.google.com/spreadsheets/d/${USER_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('user')}&t=${Date.now()}`;
}
const LOGIN_KEY = 'hrgaLoggedInUser';

function renderLoginInfo(user){
  const el=document.getElementById('loginInfo');
  if(!el) return;
  const nama=(user.nama||user.username||'?').trim();
  el.innerHTML = `Masuk sebagai <b>${nama}</b>${user.role?' &middot; '+user.role:''} &middot; <a id="logoutLink">Keluar</a>`;
  const logoutLink=document.getElementById('logoutLink');
  if(logoutLink) logoutLink.addEventListener('click', ()=>{
    localStorage.removeItem(LOGIN_KEY);
    location.reload();
  });
}

function showAppAfterLogin(user){
  renderLoginInfo(user);
  document.body.classList.remove('pre-auth');
  loadData();
}

/* Sesi ter-cache di localStorage divalidasi ULANG live ke sheet "user"
   setiap kali fungsi ini dipanggil (dipanggil sekali di awal, lihat paling
   bawah) - bukan langsung dipercaya begitu saja. */
function tryRestoreLogin(){
  let cached;
  try{
    const raw = localStorage.getItem(LOGIN_KEY);
    if(!raw) return;
    cached = JSON.parse(raw);
  }catch(e){ localStorage.removeItem(LOGIN_KEY); return; }
  if(!cached || !cached.username || !cached.password){ localStorage.removeItem(LOGIN_KEY); return; }

  fetch(userCsvUrl()).then(r=>{
    if(!r.ok) throw new Error('fetch gagal');
    return r.text();
  }).then(text=>{
    const rows=parseCSV(text);
    const head=rows[0].map(h=>(h||'').trim().toLowerCase());
    const iNama=head.indexOf('nama'), iUser=head.indexOf('username'), iPass=head.indexOf('password'), iRole=head.indexOf('role');
    const match=rows.slice(1).find(r=>
      (r[iUser]||'').trim().toLowerCase()===cached.username.toLowerCase() &&
      (r[iPass]||'').trim()===cached.password
    );
    if(match){
      const user={ nama:(iNama>=0?(match[iNama]||'').trim():''), username:(match[iUser]||'').trim(), role:(iRole>=0?(match[iRole]||'').trim():''), password: cached.password };
      try{ localStorage.setItem(LOGIN_KEY, JSON.stringify(user)); }catch(e){ /* localStorage diblokir */ }
      showAppAfterLogin(user);
    } else {
      // username/password sudah beda dari sheet (diganti/dihapus) - paksa logout,
      // layar login (default tampil lewat body.pre-auth) yang jadi terlihat.
      localStorage.removeItem(LOGIN_KEY);
    }
  }).catch(()=>{
    // gagal fetch (mis. koneksi terputus sesaat) - jangan paksa logout hanya
    // krn ini, tetap izinkan lanjut pakai sesi ter-cache.
    showAppAfterLogin(cached);
  });
}

function handleLoginSubmit(e){
  e.preventDefault();
  const uEl=document.getElementById('loginUsername'), pEl=document.getElementById('loginPassword');
  const errEl=document.getElementById('loginError'), btn=document.getElementById('loginSubmitBtn');
  const username=(uEl.value||'').trim(), password=(pEl.value||'').trim();
  errEl.textContent='';
  if(!username || !password){ errEl.textContent='Username dan password wajib diisi.'; return; }
  btn.disabled=true; btn.textContent='Memeriksa...';
  fetch(userCsvUrl()).then(r=>{
    if(!r.ok) throw new Error('fetch gagal');
    return r.text();
  }).then(text=>{
    const rows=parseCSV(text);
    const head=rows[0].map(h=>(h||'').trim().toLowerCase());
    const iNama=head.indexOf('nama'), iUser=head.indexOf('username'), iPass=head.indexOf('password'), iRole=head.indexOf('role');
    const match=rows.slice(1).find(r=>
      (r[iUser]||'').trim().toLowerCase()===username.toLowerCase() &&
      (r[iPass]||'').trim()===password
    );
    btn.disabled=false; btn.textContent='Masuk';
    if(match){
      const user={ nama:(iNama>=0?(match[iNama]||'').trim():''), username:(match[iUser]||'').trim(), role:(iRole>=0?(match[iRole]||'').trim():''), password: password };
      try{ localStorage.setItem(LOGIN_KEY, JSON.stringify(user)); }catch(e){ /* localStorage diblokir - tetap lanjut tanpa persist */ }
      showAppAfterLogin(user);
    } else {
      errEl.textContent='Username atau password salah.';
    }
  }).catch(()=>{
    btn.disabled=false; btn.textContent='Masuk';
    errEl.textContent='Gagal memuat data akun. Periksa koneksi lalu coba lagi.';
  });
}

document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);

/* Halaman awal: kalau sudah pernah login (di sini atau di HRGA Hub / Struktur
   Organisasi), kredensial ter-cache dicek ulang dulu ke sheet sebelum
   dipercaya (lihat tryRestoreLogin). Kalau belum ada sesi, layar login
   (default tampil lewat body.pre-auth) yang jadi satu-satunya hal yang
   terlihat. */
/* ---------- Auto-logout kalau idle (tidak ada aktivitas) > 6 jam ---------- */
const IDLE_KEY = 'hrgaLastActivity';
const IDLE_LIMIT_MS = 6*60*60*1000; // 6 jam

function markActivity(){
  try{ localStorage.setItem(IDLE_KEY, String(Date.now())); }catch(e){}
}
function isIdleTimedOut(){
  try{
    const last = parseInt(localStorage.getItem(IDLE_KEY)||'0', 10);
    return last > 0 && (Date.now() - last) > IDLE_LIMIT_MS;
  }catch(e){ return false; }
}
function forceIdleLogout(){
  try{
    localStorage.removeItem(LOGIN_KEY);
    localStorage.removeItem(IDLE_KEY);
  }catch(e){}
  location.reload();
}
// Kalau sesi terakhir sudah lewat 6 jam idle sebelum halaman ini dibuka
// (mis. tab ditinggal lama lalu di-refresh/dibuka lagi), paksa logout dulu
// sebelum tryRestoreLogin() sempat memulihkan sesi lama.
if(isIdleTimedOut()){
  try{
    localStorage.removeItem(LOGIN_KEY);
    localStorage.removeItem(IDLE_KEY);
  }catch(e){}
}
markActivity();
['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(ev=>{
  document.addEventListener(ev, markActivity, {passive:true});
});
// Cek berkala (tiap 1 menit) selama tab tetap terbuka - supaya auto-logout
// tetap terjadi walau user tidak reload/navigasi halaman.
setInterval(()=>{ if(isIdleTimedOut()) forceIdleLogout(); }, 60*1000);

tryRestoreLogin();
</script>
</body>
</html>
